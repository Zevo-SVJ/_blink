<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Blink — See yourself the way others see you.</title>
    <meta
      name="description"
      content="Blink reads your Instagram the way other people do — your crush, a stranger, a recruiter — and shows you the first impression you actually make."
    />

    <!-- Open Graph / Facebook / Discord -->
    <meta property="og:title" content="Blink — See yourself the way others see you." />
    <meta
      property="og:description"
      content="Blink reads your Instagram the way other people do and shows you the first impression you actually make."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/brand/hero-visual.jpg" />
    <meta property="og:url" content="https://blink.app" />
    <meta property="og:site_name" content="Blink" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Blink — See yourself the way others see you." />
    <meta
      name="twitter:description"
      content="Blink reads your Instagram the way other people do and shows you the first impression you actually make."
    />
    <meta name="twitter:image" content="/brand/hero-visual.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Loaded without blocking the first paint. A stylesheet in the head is
      render-blocking, so on a phone this alone held the whole page behind a
      DNS lookup, a TLS handshake and a round trip before anything could be
      drawn. `display=swap` means the shell below paints in the system font
      and reflows to Inter when it lands.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <!--
      ══════════════════════════════════════════════════════════════════════
      First paint
      ══════════════════════════════════════════════════════════════════════

      `#root` is empty until the JS bundle has downloaded, parsed and run. On
      a fast-3G phone that measured 1.83 s of blank navy — the "blue screen"
      with nothing on it. No amount of animation tuning fixes that, because
      React has not run yet.

      So the hero is also written here, in plain HTML with its CSS inline, and
      paints in ~0.2 s. React mounts underneath and `main.tsx` removes this
      once the real hero is on screen. The two are matched deliberately —
      same gradient, same type scale, same button geometry — so the handover
      is invisible rather than a jump.

      Keep them in sync. If the hero's headline or CTA changes, change it in
      both places; a mismatch here is a visible flicker on every cold load.
    -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 0 1rem;
        text-align: center;
        background: radial-gradient(
          ellipse 80% 60% at 50% 0%,
          hsl(220 70% 14%) 0%,
          hsl(220 84% 10%) 40%,
          hsl(220 80% 8%) 100%
        );
        font-family: "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      #boot[hidden] {
        display: none;
      }

      #boot .b-mark {
        position: absolute;
        top: 1.15rem;
        left: 1rem;
        font-size: 1.125rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #fff;
      }

      #boot h1 {
        margin: 0;
        max-width: 36rem;
        font-size: 2rem;
        font-weight: 800;
        line-height: 1.02;
        letter-spacing: -0.035em;
        color: #fff;
      }

      #boot .b-accent {
        display: inline-block;
        position: relative;
        padding-bottom: 0.375rem;
        color: #afe0f9;
      }

      #boot .b-accent::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: 0;
        width: 100%;
        height: 3px;
        border-radius: 999px;
        background: rgba(175, 224, 249, 0.7);
      }

      #boot p {
        margin: 1rem 0 0;
        max-width: 24rem;
        font-size: 0.95rem;
        line-height: 1.6;
        color: rgba(255, 255, 255, 0.55);
      }

      #boot .b-cta {
        margin-top: 1.75rem;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        min-height: 3.25rem;
        padding: 0 1.75rem;
        border-radius: 1rem;
        background: #afe0f9;
        color: #04102d;
        font-size: 1rem;
        font-weight: 700;
        text-decoration: none;
      }

      @media (min-width: 400px) {
        #boot h1 { font-size: 2.25rem; }
      }

      @media (min-width: 640px) {
        #boot h1 { font-size: 3rem; }
        #boot p { font-size: 1.125rem; max-width: 28rem; }
      }

      @media (min-width: 1024px) {
        #boot h1 { font-size: 3.5rem; }
      }
    </style>

    <meta name="theme-color" content="#04102D" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
  </head>

  <body>
    <div id="root"></div>

    <!-- Removed by main.tsx as soon as the real hero has painted. -->
    <div id="boot">
      <span class="b-mark">Blink</span>
      <h1>
        See yourself the way<br /><span class="b-accent">others see you.</span>
      </h1>
      <p>Blink analyzes your Instagram presence and reveals the first impression you make.</p>
      <a class="b-cta" href="/analyze">See my first impression</a>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
