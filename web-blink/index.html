<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Blink — See yourself the way others see you.</title>
    <meta
      name="description"
      content="Blink reads your Instagram the way other people do — your crush, a stranger, a recruiter — and shows you the first impression you actually make."
    />

    <!-- Open Graph / Facebook / Discord -->
    <meta property="og:title" content="Blink — See yourself the way others see you." />
    <meta
      property="og:description"
      content="Blink reads your Instagram the way other people do and shows you the first impression you actually make."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/brand/hero-visual.jpg" />
    <meta property="og:url" content="https://blink.app" />
    <meta property="og:site_name" content="Blink" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Blink — See yourself the way others see you." />
    <meta
      name="twitter:description"
      content="Blink reads your Instagram the way other people do and shows you the first impression you actually make."
    />
    <meta name="twitter:image" content="/brand/hero-visual.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Loaded without blocking the first paint. A stylesheet in the head is
      render-blocking, so on a phone this alone held the whole page behind a
      DNS lookup, a TLS handshake and a round trip before anything could be
      drawn. `display=swap` means the shell below paints in the system font
      and reflows to Inter when it lands.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <meta name="theme-color" content="#04102D" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
  </head>

  <body>
    <!-- Inside #root on purpose: React's first commit replaces it. -->
    <!--
      Filled at build time with the real landing page — see
      `scripts/prerender.mjs` and `src/entry-server.tsx`. React hydrates
      whatever is here rather than replacing it, so the first paint and the
      interactive page are the same DOM.
    -->
    <div id="root"></div>

    <script>
      /*
        Static hosts serve this same file as the SPA fallback for any path they
        have no file for — /analyze, /u/:id, /library/:id. On those paths the
        prerendered landing markup above is simply wrong: React would hydrate
        against it, mismatch, and the reader would see the landing flash before
        their actual page arrived.

        Clearing it here is synchronous and happens during parse, before the
        first paint, so nothing wrong is ever shown. `main.tsx` then finds an
        empty #root and mounts normally instead of hydrating.
      */
      if (location.pathname !== "/") {
        var root = document.getElementById("root");
        if (root) root.textContent = "";
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
