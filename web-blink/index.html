<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Blink — See yourself the way others see you.</title>
    <meta
      name="description"
      content="Blink reads your Instagram the way other people do — your crush, a stranger, a recruiter — and shows you the first impression you actually make."
    />

    <!-- Open Graph / Facebook / Discord -->
    <meta property="og:title" content="Blink — See yourself the way others see you." />
    <meta
      property="og:description"
      content="Blink reads your Instagram the way other people do and shows you the first impression you actually make."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/brand/hero-visual.jpg" />
    <meta property="og:url" content="https://blink.app" />
    <meta property="og:site_name" content="Blink" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Blink — See yourself the way others see you." />
    <meta
      name="twitter:description"
      content="Blink reads your Instagram the way other people do and shows you the first impression you actually make."
    />
    <meta name="twitter:image" content="/brand/hero-visual.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <meta name="theme-color" content="#04102D" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
